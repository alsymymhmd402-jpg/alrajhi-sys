<!doctype html>
<html lang="ar" dir="rtl">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>غرفة عمليات المؤسسة</title>
    <meta name="theme-color" content="#155eef" />
    <link rel="icon" type="image/jpeg" href="/manus-storage/alwaleed-philanthropies-mark_d87d264e.jpg" />
    <link rel="apple-touch-icon" href="/manus-storage/alwaleed-philanthropies-mark_d87d264e.jpg" />
    <link id="app-manifest" rel="manifest" href="/manifest-owner.webmanifest" />
    <script>
      (function () {
        var path = window.location.pathname;
        var client = /^\/(invite|client|chat)\//.test(path);
        var clientMatch = path.match(/^\/client\/([^/]+)(?:\/(?:chat|privacy))?$/);
        var clientStart = clientMatch ? '/client/' + clientMatch[1] : '';
        document.title = client ? 'مراسلة المؤسسة' : 'غرفة عمليات المؤسسة';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', client ? '#075e54' : '#155eef');
        document.getElementById('app-manifest').setAttribute('href', client ? '/manifest-client.webmanifest' + (clientStart ? '?start=' + encodeURIComponent(clientStart) : '') : '/manifest-owner.webmanifest');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    THIS IS THE END OF A COMMENT BLOCK, BLOCK TO BE DELETED -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
