<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>خدمة عملاء مؤسسة الوليد بن طلال</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #061410; color: #effff8; font-family: Arial, sans-serif; }
      body { min-height: 100vh; display: grid; place-items: center; overflow: hidden; position: relative; }
      body::before { content: ""; position: fixed; inset: 0; opacity: .08; background: url('https://voicecall-uwxhmyez.manus.space/manus-storage/kingdom-watermark_411c4335.png') center/55% auto no-repeat; pointer-events: none; }
      main { width: min(88vw, 360px); text-align: center; position: relative; z-index: 1; }
      .logo { width: 112px; height: 112px; object-fit: cover; border-radius: 28px; display: block; margin: 0 auto 26px; box-shadow: 0 12px 45px #00d7a044; border: 1px solid #7ff5ce55; background: #0e2c23; }
      h1 { font-size: 21px; margin: 0; line-height: 1.6; }
      p { color: #a7c9bd; font-size: 14px; margin: 8px 0 30px; }
      .track { height: 6px; border-radius: 999px; background: #1c3d32; overflow: hidden; }
      .bar { width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #18b890, #d4f56a); animation: load 1.5s ease-in-out infinite; }
      .status { margin-top: 12px; color: #79cbb4; font-size: 12px; }
      @keyframes load { 0% { transform: translateX(240%); } 100% { transform: translateX(-320%); } }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="https://voicecall-uwxhmyez.manus.space/manus-storage/institution-green-splash_1f36006a.jpg" alt="شعار المؤسسة" />
      <h1>خدمة عملاء مؤسسة الوليد بن طلال</h1>
      <p>مساحتك الآمنة للتواصل مع فريق المؤسسة</p>
      <div class="track" aria-label="جاري التحميل"><div class="bar"></div></div>
      <div class="status">جارٍ تجهيز مساحة التواصل…</div>
    </main>
    <script>
      const target = new URLSearchParams(location.search).get('invite');
      setTimeout(() => {
        location.replace(target ? 'https://voicecall-uwxhmyez.manus.space/client/start?invite=' + encodeURIComponent(target) : 'https://voicecall-uwxhmyez.manus.space/client/start');
      }, 1100);
    </script>
  </body>
</html>
